{% set name = "monetio" %}
{% set version = "0.3.3" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/noaa-oar-arl/{{ name }}/archive/v{{ version }}.tar.gz
  sha256: abde3d6cb1aa59489fd095f1f557ff01559936a34d9d2feaeb049fda7453bae6

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools
  run:
    - python >={{ python_min }}
    #
    - cftime
    - dask
    - filelock
    - fsspec
    - h5netcdf
    - h5py
    - joblib
    - lxml
    - netcdf4
    - numpy
    - pandas
    - pyresample
    - requests
    - s3fs
    - scipy
    - xarray

test:
  requires:
    - python {{ python_min }}
  imports:
    - monetio
    - monetio.models
    - monetio.obs
    - monetio.profile
    - monetio.sat

about:
  home: https://monetio.readthedocs.io
  license: MIT
  license_family: MIT
  license_file: LICENSE
  dev_url: https://github.com/noaa-oar-arl/monetio
  summary: The Model and ObservatioN Evaluation Tool - Input / Output

extra:
  recipe-maintainers:
    - zmoon
    - bbakernoaa
